<!DOCTYPE html>
<html lang="en" >
<head>
    <meta charset="UTF-8">
    <title>Link Expired — CloudStore</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0f0f1a; color: #e2e8f0; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 48px 40px; text-align: center; max-width: 420px; }
        .icon { font-size: 64px; color: #ef4444; margin-bottom: 24px; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon"><i class="fas fa-link-slash"></i></div>
    <h3>Link Expired or Revoked</h3>
    <p class="text-muted">This share link is no longer valid. It may have expired or been revoked by the owner.</p>
    <p class="text-muted small">Contact the person who shared this file to get a new link.</p>
</div>
</body>
</html>
